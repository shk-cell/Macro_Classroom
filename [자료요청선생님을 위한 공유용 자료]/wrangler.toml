# ⚠️ 아래 두 값은 본인 Cloudflare 계정 기준으로 채워야 합니다.
#   - account_id: Cloudflare 대시보드 우측 하단(또는 워커 화면 URL)에서 확인 가능
#   - kv_namespaces id: `wrangler kv:namespace create RATE_LIMIT` 실행 후 발급되는 id
name = "macro-classroom"
main = "worker.js"
compatibility_date = "2024-01-01"
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "YOUR_KV_NAMESPACE_ID"

[[rules]]
type = "Text"
globs = ["**/*.html"]
