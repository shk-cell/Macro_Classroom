<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매크로실습실 - 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }

  /* ── 로그인 ── */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 16px;
    padding: 40px 36px; width: 340px;
  }
  .login-title { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 6px; }
  .login-sub { font-size: 13px; color: #666; margin-bottom: 28px; }
  .login-input {
    width: 100%; background: #0f1117; border: 1px solid #333; border-radius: 8px;
    padding: 13px 16px; font-size: 15px; color: #fff; font-family: inherit;
    outline: none; margin-bottom: 12px; transition: border-color 0.2s;
  }
  .login-input:focus { border-color: #c678ff; }
  .login-btn {
    width: 100%; background: linear-gradient(135deg, #8b3fff, #c678ff);
    border: none; border-radius: 8px; padding: 14px; font-size: 15px;
    font-weight: 700; color: #fff; cursor: pointer; font-family: inherit;
  }
  .login-err { font-size: 13px; color: #ff5050; margin-top: 10px; display: none; }

  /* ── 대시보드 ── */
  .dashboard { display: none; }
  .dash-header {
    background: #1a1d27; border-bottom: 1px solid #2a2d3a;
    padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
  }
  .dash-logo { font-size: 16px; font-weight: 900; color: #c678ff; letter-spacing: 2px; }
  .dash-logout { font-size: 12px; color: #555; cursor: pointer; }
  .dash-logout:hover { color: #ff5050; }

  .dash-body { padding: 32px; max-width: 900px; margin: 0 auto; }

  /* ── 제어 패널 ── */
  .ctrl-panel {
    background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 14px;
    padding: 28px; margin-bottom: 28px;
  }
  .ctrl-title { font-size: 13px; color: #888; letter-spacing: 1px; margin-bottom: 20px; }
  .ctrl-status {
    text-align: center; padding: 20px; border-radius: 10px; margin-bottom: 24px;
    font-size: 18px; font-weight: 700; transition: all 0.3s;
  }
  .ctrl-status.closed { background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.25); color: #ff5050; }
  .ctrl-status.open { background: rgba(198,120,255,0.1); border: 1px solid rgba(198,120,255,0.4); color: #c678ff; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(198,120,255,0.3);} 50%{box-shadow:0 0 0 8px rgba(198,120,255,0);} }

  .ctrl-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .ctrl-btn {
    border: none; border-radius: 10px; padding: 14px 10px;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: all 0.2s;
  }
  .ctrl-btn.open { background: linear-gradient(135deg, #8b3fff, #c678ff); color: #fff; }
  .ctrl-btn.open:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(198,120,255,0.3); }
  .ctrl-btn.close { background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.3); color: #ff5050; }
  .ctrl-btn.close:hover { background: rgba(255,80,80,0.25); }
  .ctrl-btn.reset { background: rgba(255,255,255,0.05); border: 1px solid #333; color: #666; }
  .ctrl-btn.reset:hover { color: #ff5050; border-color: #ff5050; }

  /* ── 통계 ── */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat-card {
    background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 12px;
    padding: 20px; text-align: center;
  }
  .stat-value { font-size: 36px; font-weight: 900; color: #c678ff; }
  .stat-label { font-size: 12px; color: #555; margin-top: 4px; letter-spacing: 1px; }

  /* ── 예약자 목록 ── */
  .list-panel {
    background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 14px; padding: 28px;
  }
  .list-title { font-size: 13px; color: #888; letter-spacing: 1px; margin-bottom: 16px; }
  .list-empty { text-align: center; color: #444; padding: 40px; font-size: 14px; }
  .list-item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; border-radius: 8px; margin-bottom: 6px;
    background: rgba(255,255,255,0.03); border: 1px solid transparent;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
  .list-rank {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
    background: rgba(198,120,255,0.15); border: 1px solid rgba(198,120,255,0.3);
    color: #c678ff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .list-name { font-size: 15px; font-weight: 600; flex: 1; }
  .list-time { font-size: 12px; color: #555; }
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-title">관리자 패널</div>
    <div class="login-sub">매크로실습실 컨트롤 타워</div>
    <input class="login-input" type="password" id="pw-input" placeholder="비밀번호" autocomplete="off">
    <button class="login-btn" onclick="doLogin()">로그인</button>
    <div class="login-err" id="login-err">비밀번호가 틀렸습니다.</div>
  </div>
</div>

<!-- 대시보드 -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <div class="dash-logo">MACRO CLASSROOM</div>
    <div class="dash-logout" onclick="logout()">로그아웃</div>
  </div>
  <div class="dash-body">

    <!-- 제어 패널 -->
    <div class="ctrl-panel">
      <div class="ctrl-title">CONTROL PANEL</div>
      <div class="ctrl-status closed" id="ctrl-status">⛔ 예매 닫힘</div>
      <div class="ctrl-btns">
        <button class="ctrl-btn open" onclick="openReserve()">🟢 예매 열기</button>
        <button class="ctrl-btn close" onclick="closeReserve()">🔴 예매 닫기</button>
        <button class="ctrl-btn reset" onclick="resetAll()">🔄 전체 초기화</button>
      </div>
    </div>

    <!-- 통계 -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-value" id="stat-reserved">0</div>
        <div class="stat-label">예약 완료</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-left">10</div>
        <div class="stat-label">남은 좌석</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-total">10</div>
        <div class="stat-label">전체 좌석</div>
      </div>
    </div>

    <!-- 예약자 목록 -->
    <div class="list-panel">
      <div class="list-title">예약자 목록 (실시간)</div>
      <div id="list-body"><div class="list-empty">예약자가 없습니다.</div></div>
    </div>

  </div>
</div>

<script>
let adminToken = '';

async function doLogin() {
  const pw = document.getElementById('pw-input').value;
  const res = await fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  });
  const data = await res.json();
  if (data.success) {
    adminToken = data.token;
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    poll();
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
}

function logout() {
  adminToken = '';
  location.reload();
}

async function adminFetch(url, method = 'GET', body = null) {
  const opts = { method, headers: { 'X-Admin-Token': adminToken, 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  return res.json();
}

async function openReserve() {
  await adminFetch('/api/admin/open', 'POST');
  poll();
}
async function closeReserve() {
  await adminFetch('/api/admin/close', 'POST');
  poll();
}
async function resetAll() {
  if (!confirm('예약 내역을 모두 초기화할까요?')) return;
  await adminFetch('/api/admin/reset', 'POST');
  poll();
}

async function poll() {
  if (!adminToken) return;
  const state = await adminFetch('/api/admin/state');
  if (!state) return;

  // 상태 표시
  const ctrl = document.getElementById('ctrl-status');
  if (state.seats_left === 0) {
    ctrl.className = 'ctrl-status closed';
    ctrl.textContent = '🎟 매진 — 10/10 예약 완료';
  } else if (state.is_open) {
    ctrl.className = 'ctrl-status open';
    ctrl.textContent = '🟢 예매 진행 중';
  } else {
    ctrl.className = 'ctrl-status closed';
    ctrl.textContent = '⛔ 예매 닫힘';
  }

  // 통계
  const reserved = state.total_seats - state.seats_left;
  document.getElementById('stat-reserved').textContent = reserved;
  document.getElementById('stat-left').textContent = state.seats_left;
  document.getElementById('stat-total').textContent = state.total_seats;

  // 목록
  const listEl = document.getElementById('list-body');
  if (state.reservations.length === 0) {
    listEl.innerHTML = '<div class="list-empty">예약자가 없습니다.</div>';
  } else {
    listEl.innerHTML = state.reservations.map(r => `
      <div class="list-item">
        <div class="list-rank">${r.seat_number}</div>
        <div class="list-name">${r.name}</div>
        <div class="list-time">${r.reserved_at ? r.reserved_at.slice(11,19) : ''}</div>
      </div>
    `).join('');
  }
}

document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

setInterval(() => { if (adminToken) poll(); }, 1500);
</script>
</body>
</html>
